<!DOCTYPE html>
<html lang="en" data-lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TileUI - Demo</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0a0a0a" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Outfit:wght@400;500&family=Silkscreen:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet" />

  <style>
    :root {
      --demo-font: "Silkscreen", "DotGothic16", cursive;
    }

    [data-lang="en"] [lang="ja"] { display: none; }
    [data-lang="ja"] [lang="en"] { display: none; }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: #faf9f6;
      font-family: var(--demo-font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .tileui-panel {
      --tileui-bg: #000000;
      --tileui-tile-bg: #000000;
      --tileui-tile-bg-hover: #111111;
      --tileui-border: #333333;
      --tileui-text: #faf9f6;
      --tileui-text-muted: #888888;
      --tileui-accent: #faf9f6;
      --tileui-accent-dim: rgba(250, 249, 246, 0.2);
      --tileui-knob-track: #333333;
      --tileui-knob-thumb: #faf9f6;
      --tileui-toggle-off: #333333;
      --tileui-font-family: "Outfit", sans-serif;
    }

    .tileui-drawer {
      background: #000000;
      border: 1px solid rgba(250, 249, 246, 0.15);
      padding: 4px;
    }

    .dock-header,
    .dock-center__title,
    .dock-center__desc,
    .dock-center__hint,
    .dock-center__direction {
      text-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .dock-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      font-family: var(--demo-font);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      z-index: 100;
    }

    .dock-header__logo {
      font-size: 14px;
      letter-spacing: 0.2em;
    }

    .dock-header__link {
      color: #888888;
      text-decoration: none;
      transition: color 0.15s;
    }

    .dock-header__link:hover {
      color: #faf9f6;
    }

    .dock-center {
      text-align: center;
      max-width: 480px;
      padding: 0 24px;
    }

    .dock-center__title {
      font-family: var(--demo-font);
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .dock-center__desc {
      font-size: 14px;
      color: #888888;
      line-height: 1.6;
    }

    .dock-center__hint {
      margin-top: 24px;
      font-family: var(--demo-font);
      font-size: 12px;
      color: #555555;
      letter-spacing: 0.05em;
    }

    .dock-center__hint kbd {
      display: inline-block;
      font-family: "Space Mono", monospace;
      font-size: 11px;
      background: #222222;
      border: 1px solid #444444;
      border-radius: 3px;
      padding: 1px 6px;
      color: #faf9f6;
    }

    .dock-center__direction {
      margin-top: 12px;
      font-family: var(--demo-font);
      font-size: 12px;
      color: #555555;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .dock-center__direction-value {
      color: #b38f59;
    }

    .lang-toggle {
      display: inline-flex;
      gap: 4px;
    }

    .lang-toggle__btn {
      font-family: var(--demo-font);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #555555;
      background: none;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 2px 8px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .lang-toggle__btn:hover {
      color: #faf9f6;
    }

    .lang-toggle__btn--active {
      color: #faf9f6;
      border-color: #444444;
    }
  </style>
</head>
<body>
  <header class="dock-header">
    <span class="dock-header__logo">TILEUI</span>
    <nav style="display: flex; align-items: center; gap: 16px;">
      <a class="dock-header__link" href="./index.html"><span lang="en">&larr; Main Demo</span><span lang="ja">&larr; メインデモ</span></a>
      <span class="lang-toggle">
        <button class="lang-toggle__btn" type="button" data-value="en">EN</button>
        <button class="lang-toggle__btn" type="button" data-value="ja">JA</button>
      </span>
    </nav>
  </header>

  <div class="dock-center">
    <h1 class="dock-center__title"><span lang="en">Demo</span><span lang="ja">Demo</span></h1>
    <p class="dock-center__desc">
      <span lang="en">A demo of TileUI's drawer (Dock) mode.<br />Use the buttons in the panel to switch dock direction.</span><span lang="ja">TileUI のドロワー（ドック）モードのデモ。<br />パネル内のボタンでドック方向を切り替えられます。</span>
    </p>
    <p class="dock-center__hint">
      <span lang="en">Press <kbd>G</kbd> to toggle drawer</span><span lang="ja"><kbd>G</kbd> キーでドロワーを切替</span>
    </p>
    <p class="dock-center__direction">
      <span lang="en">Current:</span><span lang="ja">現在:</span> <span class="dock-center__direction-value" id="direction-label">RIGHT</span>
    </p>
  </div>

  <script type="module" src="./dock.ts"></script>
</body>
</html>
