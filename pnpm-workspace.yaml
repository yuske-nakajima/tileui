# npm 公開から 7 日 (10080 分) 未満のパッケージはインストール不可
minimumReleaseAge: 10080

# tarball URL や git 直指定などの非通常パッケージをサブ依存に含めない
blockExoticSubdeps: true

# ライフサイクルスクリプトの実行をホワイトリスト方式で制限
onlyBuiltDependencies:
  - esbuild

# GHSA-jxxr-4gwj-5jf2 (brace-expansion DoS) 対応: 脆弱な範囲を patched 以上へ強制
overrides:
  "brace-expansion@>=5.0.0 <5.0.6": ">=5.0.6"
  # GHSA-68fv-2mgg-jv7q (source-map-js DoS) 対応
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2"
